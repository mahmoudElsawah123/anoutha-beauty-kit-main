<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>

    <!-- Luxury Dark Plum Casing -->
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#2E0854" />
    </linearGradient>

    <!-- Metallic Luxury Gold -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Ruby Rose Lipstick Bullet -->
    <linearGradient id="bulletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Sparkle Glow -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#831843" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FB7185" stroke-width="2" />
  <circle cx="32" cy="32" r="24" fill="#FFFFFF" fill-opacity="0.4" />

  <!-- Lipstick Group (Rotated -22 deg) -->
  <g transform="rotate(-22 32 35)" filter="url(#softShadow)">
    <!-- Main Outer Casing -->
    <rect x="24" y="32" width="16" height="22" rx="3.5" fill="url(#casingGrad)" />
    <!-- Gold Trim at Base -->
    <rect x="24.5" y="49" width="15" height="3" rx="1.5" fill="url(#goldGrad)" />

    <!-- Gold Collar Holder -->
    <rect x="25.5" y="22" width="13" height="11" rx="2" fill="url(#goldGrad)" />
    <line x1="28" y1="23" x2="28" y2="31" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

    <!-- Lipstick Bullet (Beveled Tip) -->
    <path d="M26.5 22 V14 C26.5 10 28.5 7.5 30.5 6.5 L36.5 11.5 C37.5 12.5 37.5 13.5 37.5 14.5 V22 Z" fill="url(#bulletGrad)" />
    
    <!-- Gloss Highlight Curve -->
    <path d="M28 20 V13.5 C28 11.5 29 9.5 30.5 8" stroke="#FFE4E6" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.85" />
    <!-- Bevel highlight facet -->
    <path d="M30.5 6.5 L36.5 11.5 L34 14.5 L28 9.5 Z" fill="#FDA4AF" opacity="0.45" />
  </g>

  <!-- Sparkles ✨ -->
  <!-- Top Right Big Star -->
  <path d="M47 8 C47 13 49 15 54 15 C49 15 47 17 47 22 C47 17 45 15 40 15 C45 15 47 13 47 8 Z" fill="url(#sparkleGlow)" />
  <circle cx="47" cy="15" r="1.5" fill="#FFFFFF" />

  <!-- Bottom Left Secondary Star -->
  <path d="M14 24 C14 27 15 28 18 28 C15 28 14 29 14 32 C14 29 13 28 10 28 C13 28 14 27 14 24 Z" fill="#FB7185" />

  <!-- Tiny Golden Starlet -->
  <circle cx="51" cy="27" r="1.5" fill="#F59E0B" />
</svg>
